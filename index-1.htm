<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Number</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="referrer" content="no-referrer-when-downgrade" />
</head>

<body class="bg-light" style="text-align:center;min-height: 100vh; background: linear-gradient(180deg,#0d86ff 0%, #65c7ff 100%);">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 mb-3">
                <!-- ✅ Verify Number Box -->
                <div class="card shadow p-4 rounded-4 text-center">
                    <h4 class="mb-3">📱 Verify Your Number</h4>
                                        <form method="POST">
                        <input type="tel" name="mobile_number" class="form-control form-control-lg mb-3 text-center"
                            placeholder="Enter your 10-digit number" maxlength="10" required>
                        <p class="text-muted small mb-3">Note: We will add your number to group.</p>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">
                            Verify Number
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-12 col-md-8">
                <!-- ✅ Bottom Ad Box -->
                
            </div>
        </div>
    </div>
    
</body>



</html>
