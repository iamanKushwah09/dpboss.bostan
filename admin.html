<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 20px 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; height: 90vh; overflow-y: auto;}
    h2 { text-align: center; color: #333; margin-top: 0;}
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px;}
    input[type="text"], input[type="password"], input[type="file"], input[type="url"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #25D366; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #1ebe57; }
    #adminPanel { display: none; }
    .error { color: red; font-size: 14px; text-align: center; margin-bottom: 10px; display: none; }
    .success { color: green; font-size: 14px; text-align: center; margin-bottom: 10px; display: none; }
    .preview { max-width: 100px; margin-top: 10px; border-radius: 5px; display: none; border: 1px solid #ccc;}
  </style>
</head>
<body>

  <!-- Login Section -->
  <div class="card" id="loginPanel" style="height: auto;">
    <h2>Admin Login</h2>
    <div class="error" id="loginError">Invalid username or password!</div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter admin">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter 123456">
    </div>
    <button onclick="login()">Login</button>
  </div>

  <!-- Admin Panel Section -->
  <div class="card" id="adminPanel">
    <h2>Dashboard</h2>
    <div class="success" id="saveSuccess">Settings saved successfully! Go back to homepage to see changes.</div>
    
    <div class="form-group">
      <label>WhatsApp Number</label>
      <input type="text" id="waNum" placeholder="e.g., 918790023843">
    </div>

    <div class="form-group">
      <label>Banner 1 (Upload or URL)</label>
      <input type="file" id="banner1File" accept="image/*" onchange="previewImage(this, 'preview1')">
      <div style="text-align: center; margin: 5px 0; font-size: 12px; color: #888;">OR</div>
      <input type="url" id="banner1Url" placeholder="Paste Image URL..." oninput="updatePreviewUrl(this, 'preview1')">
      <img id="preview1" class="preview">
    </div>

    <div class="form-group">
      <label>Banner 2 (Upload or URL)</label>
      <input type="file" id="banner2File" accept="image/*" onchange="previewImage(this, 'preview2')">
      <div style="text-align: center; margin: 5px 0; font-size: 12px; color: #888;">OR</div>
      <input type="url" id="banner2Url" placeholder="Paste Image URL..." oninput="updatePreviewUrl(this, 'preview2')">
      <img id="preview2" class="preview">
    </div>

    <button onclick="saveSettings()">Save Changes</button>
    <div style="text-align:center; margin-top: 15px;">
      <a href="/" style="color: #666; text-decoration: none; font-size: 14px;">&larr; Back to Homepage</a>
    </div>
  </div>

  <script>
    // Simple Login
    function login() {
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;
      if (u === "admin" && p === "123456") {
        document.getElementById("loginPanel").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadCurrentSettings();
      } else {
        document.getElementById("loginError").style.display = "block";
      }
    }

    const JSONBLOB_URL = "https://jsonblob.com/api/jsonBlob/019e8e65-73ad-76d9-89d0-58feb69ffdb0";

    function loadCurrentSettings() {
      fetch(JSONBLOB_URL)
        .then(res => res.json())
        .then(data => {
          document.getElementById("waNum").value = data.waNum || "";
          if (data.banner1) {
            document.getElementById("preview1").src = data.banner1;
            document.getElementById("preview1").style.display = "block";
          }
          if (data.banner2) {
            document.getElementById("preview2").src = data.banner2;
            document.getElementById("preview2").style.display = "block";
          }
        }).catch(err => console.error(err));
    }

    function resizeImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          let w = img.width, h = img.height;
          const max = 600;
          if (w > h && w > max) { h *= max / w; w = max; }
          else if (h > max) { w *= max / h; h = max; }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/jpeg", 0.6));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function previewImage(input, previewId) {
      if (input.files && input.files[0]) {
        resizeImage(input.files[0], function(dataUrl) {
          const img = document.getElementById(previewId);
          img.src = dataUrl;
          img.style.display = "block";
          document.getElementById(input.id.replace('File', 'Url')).value = "";
        });
      }
    }

    function updatePreviewUrl(input, previewId) {
      if(input.value) {
        const img = document.getElementById(previewId);
        img.src = input.value;
        img.style.display = "block";
        document.getElementById(input.id.replace('Url', 'File')).value = "";
      }
    }

    function saveSettings() {
      let waNum = document.getElementById("waNum").value.trim().replace(/[^0-9]/g, '');
      const p1 = document.getElementById("preview1");
      const p2 = document.getElementById("preview2");
      const banner1 = (p1.style.display !== "none" && p1.src !== window.location.href) ? p1.src : "";
      const banner2 = (p2.style.display !== "none" && p2.src !== window.location.href) ? p2.src : "";

      const btn = document.querySelector("button[onclick='saveSettings()']");
      btn.innerText = "Saving...";
      btn.disabled = true;

      fetch(JSONBLOB_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ waNum, banner1, banner2 })
      }).then(() => {
        const msg = document.getElementById("saveSuccess");
        msg.style.display = "block";
        setTimeout(() => msg.style.display = "none", 3000);
      }).catch(err => alert("Error: " + err))
      .finally(() => {
        btn.innerText = "Save Changes";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
